<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Шаблон HTML-страницы">
    <title>Шаблон страницы</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 48px;
            max-width: 640px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Привет, мир!</h1>
        <p>Это шаблонная HTML-страница. Замените этот текст на свой контент и начните разработку.</p>
        <a href="#" class="btn">Начать</a>
    </main>
</body>
</html>
